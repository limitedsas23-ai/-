name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e

          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle(.kts) not found"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project:"
          echo "$PROJECT_DIR"

      - name: Fix AGP 9 built-in Kotlin compatibility
        shell: bash
        run: |
          set -e

          PROPERTIES="$PROJECT_DIR/gradle.properties"

          touch "$PROPERTIES"

          if grep -q '^android\.builtInKotlin=' "$PROPERTIES"; then
            sed -i 's/^android\.builtInKotlin=.*/android.builtInKotlin=false/' "$PROPERTIES"
          else
            echo 'android.builtInKotlin=false' >> "$PROPERTIES"
          fi

          if grep -q '^android\.newDsl=' "$PROPERTIES"; then
            sed -i 's/^android\.newDsl=.*/android.newDsl=false/' "$PROPERTIES"
          else
            echo 'android.newDsl=false' >> "$PROPERTIES"
          fi

          echo "Final gradle.properties:"
          cat "$PROPERTIES"

      - name: Show Android/Kotlin configuration
        shell: bash
        run: |
          echo "Project: $PROJECT_DIR"
          echo
          echo "app/build.gradle.kts:"
          sed -n '1,80p' "$PROJECT_DIR/app/build.gradle.kts"
          echo
          echo "settings.gradle:"
          sed -n '1,120p' "$PROJECT_DIR/settings.gradle.kts" 2>/dev/null || true
          echo
          echo "settings.gradle:"
          sed -n '1,120p' "$PROJECT_DIR/settings.gradle" 2>/dev/null || true

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LegitivLinux-debug
          path: |
            extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
