name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.4.1'

      - name: Extract project ZIP
        shell: bash
        run: |
          set -e
          mkdir -p extracted

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: ZIP file not found"
            exit 1
          fi

          echo "ZIP: $ZIP_FILE"
          unzip -q "$ZIP_FILE" -d extracted

      - name: Find Gradle project
        shell: bash
        run: |
          set -e

          SETTINGS=$(find extracted -type f \( \
            -name "settings.gradle" \
            -o -name "settings.gradle.kts" \
            -o -name "settings.gradle.dcl" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: Gradle project not found"
            find extracted -maxdepth 5 -type f
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "Gradle project:"
          echo "$PROJECT_DIR"

      - name: Automatically fix duplicate Kotlin plugin
        shell: bash
        run: |
          set -e

          BUILD_FILE="$PROJECT_DIR/app/build.gradle.kts"

          if [ ! -f "$BUILD_FILE" ]; then
            echo "ERROR: app/build.gradle.kts not found"
            find "$PROJECT_DIR" -maxdepth 4 -type f
            exit 1
          fi

          echo "Original plugins:"
          sed -n '1,60p' "$BUILD_FILE"

          python3 - "$BUILD_FILE" <<'PY'
          import sys
          from pathlib import Path

          file = Path(sys.argv[1])
          text = file.read_text()

          # If the modern Kotlin Android plugin is present,
          # remove the old duplicate kotlin("android") declaration.
          if 'id("org.jetbrains.kotlin.android")' in text:
              lines = text.splitlines()
              result = []

              for line in lines:
                  stripped = line.strip()

                  if stripped.startswith('kotlin("android")'):
                      continue

                  if stripped.startswith("apply(plugin ="):
                      if "kotlin" in stripped.lower():
                          continue

                  if stripped.startswith('apply(plugin="'):
                      if "kotlin" in stripped.lower():
                          continue

                  result.append(line)

              text = "\n".join(result) + "\n"

          file.write_text(text)
          PY

          echo "Fixed plugins:"
          sed -n '1,60p' "$BUILD_FILE"

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Find APK
        shell: bash
        run: |
          find "$PROJECT_DIR" -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LegitivLinux-debug
          path: |
            extracted/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
